name: Android verification (no production release)
on:
  push:
    branches:
      - develop/bonheur-formations-android
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble test APK and debug Android App Bundle
        run: gradle :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bonheur-formations-debug-not-for-play-upload
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7
